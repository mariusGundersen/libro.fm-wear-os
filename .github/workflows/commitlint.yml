name: Conventional commits

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          failed=0
          while IFS= read -r subject; do
            case "$subject" in
              "Merge "*|"Revert "*|'Revert "') continue ;;
            esac
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::Not a conventional commit: $subject"
              failed=1
            fi
          done < <(git log --no-merges --format='%s' "$BASE..$HEAD")
          exit $failed
