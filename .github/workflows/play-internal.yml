name: Publish to Play (internal)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/**"
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to publish to (Wear OS form factor)"
        required: false
        default: "wear:qa"
      force:
        description: "Publish even with no feat/fix commits (bumps patch)"
        type: boolean
        required: false
        default: false

concurrency:
  group: play-internal
  cancel-in-progress: false

permissions:
  contents: write

env:
  SVU_VERSION: 3.4.4

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install svu
        run: |
          curl -sSfL -o svu.tar.gz "https://github.com/caarlos0/svu/releases/download/v${{ env.SVU_VERSION }}/svu_${{ env.SVU_VERSION }}_linux_amd64.tar.gz"
          curl -sSfL -o checksums.txt "https://github.com/caarlos0/svu/releases/download/v${{ env.SVU_VERSION }}/checksums.txt"
          grep " svu_${{ env.SVU_VERSION }}_linux_amd64.tar.gz$" checksums.txt | sha256sum -c -
          tar -xzf svu.tar.gz svu
          sudo install -m 0755 svu /usr/local/bin/svu
          svu --version | tail -5

      - name: Determine next version
        id: version
        env:
          FORCE: ${{ inputs.force }}
        run: |
          CURRENT=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo 'v0.0.0')
          NEXT=$(svu next)
          if [ "$NEXT" = "$CURRENT" ] && [ "$FORCE" = "true" ]; then
            NEXT=$(svu patch)
            echo "::warning::No feat/fix commits since $CURRENT, forcing a patch release"
          fi
          echo "previous: $CURRENT"
          echo "next:     $NEXT"
          if [ "$NEXT" = "$CURRENT" ]; then
            echo "::notice::No feat/fix/breaking commits since $CURRENT - nothing to release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "name=$NEXT" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK components
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Verify required secrets
        if: steps.version.outputs.publish == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PLAY_CREDENTIALS" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 or PLAY_SERVICE_ACCOUNT_JSON repository secret"
            exit 1
          fi

      - name: Decode upload keystore
        if: steps.version.outputs.publish == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Publish bundle to internal track
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/upload.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: ./gradlew publishReleaseBundle -PversionName="${{ steps.version.outputs.name }}" -PplayTrack="${{ inputs.track || 'wear:qa' }}"

      - name: Tag published commit
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

      - name: Upload bundle artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14
